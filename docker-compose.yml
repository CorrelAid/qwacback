services:
  schematron-worker:
    image: ghcr.io/correlaid/schematron-worker:v0.9.0  # must equal .registry-version (scripts/check-registry-version.sh)
    environment:
      - NATS_URL=nats://qwacback:${NATS_PORT:-4222}
      - NATS_TOKEN=${NATS_TOKEN:-changeme}
    depends_on:
      - qwacback
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  ddi-emitter:
    build:
      context: ./ddi-emitter
    environment:
      - DDI_EMITTER_PORT=8091
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  qwacback:
    build: .
    ports:
      - "${PB_PORT:-8090}:8080"
      - "${NATS_PORT:-4222}:${NATS_PORT:-4222}"
    environment:
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL:-admin@example.com}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:-yourpassword123}
      - PB_USER_EMAIL=${PB_USER_EMAIL:-user@example.com}
      - PB_USER_PASSWORD=${PB_USER_PASSWORD:-userpassword123}
      - GOMEMLIMIT=${GOMEMLIMIT:-512MiB}
      - NATS_PORT=${NATS_PORT:-4222}
      - NATS_TOKEN=${NATS_TOKEN:-changeme}
      - DDI_EMITTER_URL=http://ddi-emitter:8091
      # Scheduled backups (README "Backups"); unset = configured in the dashboard
      - PB_BACKUP_CRON=${PB_BACKUP_CRON:-}
      - PB_BACKUP_KEEP=${PB_BACKUP_KEEP:-}
      - PB_BACKUP_S3_BUCKET=${PB_BACKUP_S3_BUCKET:-}
      - PB_BACKUP_S3_REGION=${PB_BACKUP_S3_REGION:-}
      - PB_BACKUP_S3_ENDPOINT=${PB_BACKUP_S3_ENDPOINT:-}
      - PB_BACKUP_S3_ACCESS_KEY=${PB_BACKUP_S3_ACCESS_KEY:-}
      - PB_BACKUP_S3_SECRET=${PB_BACKUP_S3_SECRET:-}
      - PB_BACKUP_S3_FORCE_PATH_STYLE=${PB_BACKUP_S3_FORCE_PATH_STYLE:-}
    volumes:
      # The database: studies uploaded through /api/import, dashboard edits,
      # settings and local backups survive a rebuild. `docker compose down -v`
      # deletes it.
      - pb_data:/app/pb_data
    restart: always
    command: ["./qwacback", "serve", "--http=0.0.0.0:8080"]
    depends_on:
      - ddi-emitter
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'

volumes:
  pb_data:
